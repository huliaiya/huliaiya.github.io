<script>
/* 手动注册 highlightjs 组件（因为 highlight.min.js 不包含 Vue 插件） */
Vue.component('highlightjs', {
    props: ['code', 'language'],
    render: function(createElement) {
        var raw = this.code || '';
        var highlighted = raw;
        if (typeof hljs !== 'undefined') {
            try {
                if (this.language && hljs.getLanguage(this.language)) {
                    highlighted = hljs.highlight(raw, { language: this.language }).value;
                } else {
                    highlighted = hljs.highlightAuto(raw).value;
                }
            } catch(e) {
                highlighted = raw;
            }
        }
        return createElement('pre', {
            class: { 'hljs': true, 'mdui-shadow-1': true }
        }, [
            createElement('code', {
                domProps: { innerHTML: highlighted }
            })
        ]);
    }
});

Vue.config.errorHandler = function(err, vm, info) {
	console.error('Vue error:', err, info);
};

let doc = new Vue({
	el: '#doc',
	data: {
		info: {},
		websetting: {},
		loadError: '',
		loading: true,
		feedback: {
			id: '',
			name: '',
			title: '',
			content: '',
			email: ''
		}
	},
	methods: {
		apiUrl: function(url) {
			if (!url) return '';
			if (/^https?:\/\//i.test(url) || /^\/\//i.test(url)) return url;
			var base = (this.websetting && this.websetting.url) ? this.websetting.url : (window.location.protocol + '//' + window.location.host + '/');
			if (!base.endsWith('/')) base += '/';
			return base + 'API/' + url;
		},
		openFeedbackDialog: function(name) {
			var id = getRequestParam('id') || '';
			this.feedback.id = id;
			this.feedback.name = name || '';
			this.feedback.title = '';
			this.feedback.content = '';
			this.feedback.email = '';
			var self = this;
			this.$nextTick(function(){
				try {
					var inst = new mdui.Dialog('.doc_feedback_dialog');
					inst.open();
				} catch(err) {
					mdui.snackbar('弹窗打开失败，请刷新页面');
				}
			});
		},
		feedbackSend: function() {
			var title = (this.feedback.title || '').trim();
			var content = (this.feedback.content || '').trim();
			var email = (this.feedback.email || '').trim();
			if(!title || !content || !email){
				mdui.snackbar('请填写完整');
				return;
			}
			fetch('./Data/post.php', {
				method: 'POST',
				headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
				body: 'type=add_feedback&api_id=' + this.feedback.id + '&api_name=' + encodeURIComponent(this.feedback.name) + '&title=' + encodeURIComponent(title) + '&content=' + encodeURIComponent(content) + '&email=' + encodeURIComponent(email)
			})
			.then(response => response.json())
			.then(json => {
				mdui.snackbar(json.msg || '操作完成');
				if(json.code === 0){
					this.feedback.title = '';
					this.feedback.content = '';
					this.feedback.email = '';
					try { var inst = new mdui.Dialog('.doc_feedback_dialog'); inst.close(); } catch(e){}
				}
			})
			.catch(function(){
				mdui.snackbar('网络错误，请重试');
			});
		}
	},
	created (){
		var id = getRequestParam('id');
		if(!id){
			this.loading = false;
			this.loadError = '缺少接口ID参数';
			return;
		}
		fetch('./Data/api.php?type=getOneApi&id='+id)
			.then(response => response.json())
			.then(json => {
				this.loading = false;
				if(!json || json.code != 0 || !json.data){
					this.loadError = (json && json.msg) ? json.msg : '接口数据加载失败';
					this.info = {};
					return;
				}
				var d = json.data;
				if(!d || typeof d !== 'object'){
					this.loadError = '接口数据格式异常';
					this.info = {};
					return;
				}
				/* 确保所有字段都有默认值，防止页面部分空白 */
				this.info = {
					name: d.name || '未命名接口',
					desc: d.desc || '',
					url: d.url || '',
					example_url: d.example_url || d.url || '',
					format: d.format || 'JSON',
					method: d.method || 'GET',
					return: d.return || '',
					PHP_example: d.PHP_example || ''
				};
				/* 请求参数 */
				try {
					var rp = JSON.parse(d.request_parameter);
					this.info.request_parameter = Array.isArray(rp.data) ? rp.data : [];
				} catch(e) {
					this.info.request_parameter = [];
				}
				/* 返回参数 */
				try {
					var rpp = JSON.parse(d.return_parameter);
					this.info.return_parameter = Array.isArray(rpp.data) ? rpp.data : [];
				} catch(e) {
					this.info.return_parameter = [];
				}
				/* 返回状态码 */
				try {
					var ec = JSON.parse(d.error_code);
					this.info.error_code = Array.isArray(ec.data) ? ec.data : [];
				} catch(e) {
					this.info.error_code = [];
				}
			})
			.catch(() => {
				this.loading = false;
				this.loadError = '网络错误，请检查网络连接后刷新重试';
			});
		fetch('./Data/api.php?type=getWebSetting')
			.then(response => response.json())
			.then(json => {
				if(json && json.data){
					this.websetting = json.data;
					if(!this.websetting.url){
						this.websetting.url = window.location.protocol + '//' + window.location.host + '/';
					}
				}
			});
	}
});
