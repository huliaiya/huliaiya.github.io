<script>
(function(){
    var rawLogs = <?php echo $log_json; ?>;
    var logBox = document.getElementById('logBox');
    var summaryBox = document.getElementById('summaryBox');
    var actionBox = document.getElementById('actionBox');

    if(!rawLogs || rawLogs.length === 0){
        logBox.innerHTML = '<div style="color:#6c7086;text-align:center;padding:20px;">暂无安装日志记录</div>';
        summaryBox.style.display = 'block';
        summaryBox.className = 'install-summary summary-success';
        summaryBox.innerHTML = '<div class="summary-title">安装已完成</div><div class="summary-detail">数据表已成功创建，您可以开始使用系统了。</div>';
        actionBox.style.display = 'block';
        return;
    }

    var iconMap = {
        'info': '&#9432;',
        'success': '&#10004;',
        'warn': '&#9888;',
        'error': '&#10008;',
        'header': '&#9733;'
    };

    var successCount = 0, warnCount = 0, errorCount = 0;
    var html = '';
    var idx = 0;

    function appendLog(log, delay){
        setTimeout(function(){
            var icon = iconMap[log.type] || iconMap['info'];
            if(log.type === 'success') successCount++;
            else if(log.type === 'warn') warnCount++;
            else if(log.type === 'error') errorCount++;

            var div = document.createElement('div');
            div.className = 'log-line type-' + log.type;
            div.style.animationDelay = '0s';
            div.innerHTML = '<span class="log-icon">' + icon + '</span>' +
                '<span class="log-msg">' + escapeHtml(log.msg) + '</span>';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;

            if(idx === rawLogs.length - 1){
                showSummary();
            }
            idx++;
        }, delay);
    }

    function showSummary(){
        setTimeout(function(){
            var isSuccess = (errorCount === 0);
            summaryBox.style.display = 'block';
            if(isSuccess){
                summaryBox.className = 'install-summary summary-success';
                summaryBox.innerHTML = '<div class="summary-title">全部操作成功完成</div>' +
                    '<div class="summary-detail">共执行 ' + rawLogs.length + ' 步操作，其中 ' + successCount + ' 步成功' +
                    (warnCount > 0 ? '，' + warnCount + ' 步警告' : '') + '。</div>';
            }else{
                summaryBox.className = 'install-summary summary-error';
                summaryBox.innerHTML = '<div class="summary-title">安装过程中出现错误</div>' +
                    '<div class="summary-detail">共 ' + errorCount + ' 步失败，' + successCount + ' 步成功。请检查数据库权限或联系服务器商。</div>';
            }
            actionBox.style.display = 'block';
        }, 200);
    }

    function escapeHtml(str){
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    var delay = 0;
    for(var i = 0; i < rawLogs.length; i++){
        appendLog(rawLogs[i], delay);
        delay += 80;
    }
})();
</script>
