<script src="./assets/js/vue.js"></script>
<script src="./assets/js/sweetalert.min.js"></script>
<script>
    let control = new Vue({
        el: '#control',
        data: {
            apis: [],
        },
        methods: {
            deleteApi: function(id) {
                Swal.fire({
                        title: "确定删除该接口?",
                        text: "请注意数据删除后将不可恢复！",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonText: "确定删除",
                        cancelButtonText: "取消",
                    })
                    .then((result) => {
                        if (result.isConfirmed) {
                            $.ajax({
                                method: 'POST',
                                url: './Data/post.php',
                                data: {
                                    type: 'del_api',
                                    id: id
                                },
                                beforeSend: function() {
                                    Swal.fire({
                                        title: "删除中......",
                                        icon: "info",
                                        showConfirmButton: false,
                                        allowOutsideClick: false
                                    });
                                },
                                success: function(data) {
                                    try {
                                        var res = JSON.parse(data);
                                        var code = res.code;
                                        var msg = res.msg;
                                    } catch(e) {
                                        Swal.fire({ title: '返回数据格式错误', icon: 'error' });
                                        return;
                                    }
                                    if (code == 0) {
                                        Swal.fire({
                                            title: msg,
                                            text: "2秒后自动刷新页面......",
                                            icon: "success",
                                            showConfirmButton: false
                                        });
                                        setTimeout(function() {
                                            location.reload();
                                        }, 2000);
                                    } else {
                                        Swal.fire({
                                            title: msg,
                                            icon: "error",
                                            showConfirmButton: false
                                        });
                                    }
                                }
                            });
                        }
                    });
            }
        },
        created() {
            fetch('./Data/api.php?type=getAllApi')
                .then(response => response.json())
                .then(json => {
                    this.apis = json.data;
                })
        }
    });

    let search = new Vue({
        el: '#search',
        data: {
            apis: [],
            searchContent: '',
            searchResult: true,
            msg: false
        },
        methods: {
            focus: function() {
                this.msg = false;
            }
        },
        watch: {
            searchContent: function(val) {
                if (val) {
                    fetch('./Data/api.php?type=searchApi&s=' + encodeURIComponent(val))
                        .then(response => response.json())
                        .then(json => {
                            if (json.code == 0) {
                                this.searchResult = true;
                                this.apis = json.data;
                            } else {
                                this.searchResult = false;
                                this.msg = json.msg;
                            }
                        });
                } else {
                    this.searchResult = true;
                    this.apis = [];
                }
            }
        }
    });
</script>
