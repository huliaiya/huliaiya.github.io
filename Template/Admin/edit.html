<script src="./assets/js/vue.js"></script>
<script>
let edit_api = new Vue({
	el: '#edit_api',
	data: {
		info: {},
		websetting: {}
	},
	methods: {
		update: function(){
			if (!this.info.name || !this.info.url) {
				mdui.snackbar('请至少填写接口名称和文件名');
				return;
			}
			var id = getRequestParam('id');
			const form = new URLSearchParams({
				type: 'edit_api',
				id: id || '',
				name: this.info.name || '',
				enname: this.info.enname || '',
				desc: this.info.desc || '',
				url: this.info.url || '',
				example_url: this.info.example_url || '',
				format: this.info.format || '',
				method: this.info.method || '',
				request_parameter: this.info.request_parameter || '',
				return_parameter: this.info.return_parameter || '',
				error_code: this.info.error_code || '',
				PHP_example: this.info.PHP_example || '',
				source_code: this.info.source_code || '',
				return: this.info.return || '',
				status: this.info.status || '1'
			});
			fetch('./Data/post.php',{
				method:'POST',
				headers: {
       		 		'Content-Type': 'application/x-www-form-urlencoded'
				},
				body: form.toString()
			})
				.then(response => response.json())
				.then(json => {
					mdui.snackbar(json.msg)
				})
				.catch(function(error){
					mdui.snackbar('网络错误: ' + error.message)
				})
		}
	},
	created (){
		var id = getRequestParam('id');
		fetch('./Data/api.php?type=getOneApi&id='+id)
			.then(response => response.json())
			.then(json => {
				if (!json || json.code != 0 || !json.data) {
					mdui.snackbar(json && json.msg ? json.msg : '获取接口数据失败');
					return;
				}
				this.info = json.data;
				try {
					/* 请求参数 */
					var request_parameter = json.data.request_parameter;
					var parsed = JSON.parse(request_parameter).data;
					var request_parameter_new = '';
					$.each(parsed, function(key, value){
						request_parameter_new += '['+value.name+'--'+value.type+'--'+value.required+'--'+value.info+']';
					});
					this.info.request_parameter = request_parameter_new;
					/* 返回参数 */
					var return_parameter = json.data.return_parameter;
					parsed = JSON.parse(return_parameter).data;
					var return_parameter_new = '';
					$.each(parsed, function(key, value){
						return_parameter_new += '['+value.name+'--'+value.type+'--'+value.msg+']';
					});
					this.info.return_parameter = return_parameter_new;
					/* 返回状态码 */
					var error_code = json.data.error_code;
					parsed = JSON.parse(error_code).data;
					var error_code_new = '';
					$.each(parsed, function(key, value){
						error_code_new += '['+value.code+'--'+value.msg+']';
					});
					this.info.error_code = error_code_new;
				} catch(e) {
					/* JSON解析失败时保持原值 */
				}
			});
		fetch('./Data/api.php?type=getWebSetting')
			.then(response => response.json())
			.then(json => {
				if (json && json.data) {
					this.websetting = json.data;
				}
			});
	}
});
</script>
