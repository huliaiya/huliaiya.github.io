<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Test Rainbow Animation v2</title>
<style>

  @-webkit-keyframes flowRainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: -300% 50%; }
  }
  @keyframes flowRainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: -300% 50%; }
  }
  .rainbow-title {
    background: linear-gradient(270deg, #f06292, #ba68c8, #64b5f6, #4fc3f7, #4dd0e1, #81c784, #aed581, #ffb74d, #ff8a65, #e57373, #f06292);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    -webkit-animation: flowRainbow 8s linear infinite;
    animation: flowRainbow 8s linear infinite;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.08));
    will-change: background-position;
  }
  .rainbow-subtitle {
    background: linear-gradient(270deg, #f06292, #ba68c8, #64b5f6, #4dd0e1, #81c784, #ffb74d, #ff8a65, #f06292);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    -webkit-animation: flowRainbow 12s linear infinite;
    animation: flowRainbow 12s linear infinite;
    will-change: background-position;
  }
  .rainbow-section {
    background: linear-gradient(270deg, #667eea, #764ba2, #f06292, #ff8a65, #4dd0e1, #667eea);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    -webkit-animation: flowRainbow 15s linear infinite;
    animation: flowRainbow 15s linear infinite;
    font-weight: 800;
    will-change: background-position;
  }
  .rainbow-card {
    background-image: linear-gradient(270deg, #f06292, #ba68c8, #64b5f6, #4fc3f7, #4dd0e1, #81c784, #aed581, #ffb74d, #ff8a65, #e57373, #f06292) !important;
    background-size: 300% 100% !important;
    background-position: 0% 50% !important;
    background-repeat: no-repeat !important;
    -webkit-animation: flowRainbow 6s linear infinite !important;
    animation: flowRainbow 6s linear infinite !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
    will-change: background-position;
  }
  .rainbow-btn {
    background-image: linear-gradient(270deg, #f06292, #ba68c8, #64b5f6, #4fc3f7, #4dd0e1, #81c784, #aed581, #ffb74d, #ff8a65, #e57373, #f06292) !important;
    background-size: 300% 100% !important;
    background-position: 0% 50% !important;
    background-repeat: no-repeat !important;
    -webkit-animation: flowRainbow 5s linear infinite !important;
    animation: flowRainbow 5s linear infinite !important;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.35) !important;
    border: 1px solid rgba(255, 255, 255, 0.25) !important;
    will-change: background-position;
  }

body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
  padding: 20px;
}
</style>
</head>
<body>
<h1>Rainbow Animation Test v2</h1>

<h2>卡片测试：</h2>
<div style="width: 400px; padding: 28px 26px; border-radius: 26px; background-image: linear-gradient(270deg, #f06292, #ba68c8, #64b5f6, #4fc3f7, #4dd0e1, #81c784, #aed581, #ffb74d, #ff8a65, #e57373, #f06292); background-size: 300% 100%; background-position: 0% 50%; background-repeat: no-repeat; -webkit-animation: flowRainbow 6s linear infinite; animation: flowRainbow 6s linear infinite; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.2);">
  <h3 style="color: #fff;">测试卡片</h3>
  <p style="color: rgba(255,255,255,0.9);">如果颜色在流动变化，说明动画正常</p>
</div>

<br><br>
<h2>按钮测试：</h2>
<a href="#" style="display: inline-block; padding: 11px 26px; color: #fff; border-radius: 60px; text-decoration: none; font-size: 13.5px; font-weight: 700; background-image: linear-gradient(270deg, #f06292, #ba68c8, #64b5f6, #4fc3f7, #4dd0e1, #81c784, #aed581, #ffb74d, #ff8a65, #e57373, #f06292); background-size: 300% 100%; background-position: 0% 50%; background-repeat: no-repeat; -webkit-animation: flowRainbow 5s linear infinite; animation: flowRainbow 5s linear infinite; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.35); border: 1px solid rgba(255, 255, 255, 0.25);">前往爱发电主页</a>

<script>
setInterval(function() {
  var card = document.querySelector('div[style*="flowRainbow"]');
  var btn = document.querySelector('a[style*="flowRainbow"]');
  if (card) console.log('Card bg-pos:', window.getComputedStyle(card).backgroundPosition);
  if (btn) console.log('Btn bg-pos:', window.getComputedStyle(btn).backgroundPosition);
}, 1000);
</script>
</body>
</html>
