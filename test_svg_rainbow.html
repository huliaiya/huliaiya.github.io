<!DOCTYPE html>

<h2>SVG Animation Test</h2>
<h3>Test 1: Inline SVG</h3>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="300%" y2="0%">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="10%" stop-color="#ba68c8"/>
      <stop offset="20%" stop-color="#64b5f6"/>
      <stop offset="30%" stop-color="#4fc3f7"/>
      <stop offset="40%" stop-color="#4dd0e1"/>
      <stop offset="50%" stop-color="#81c784"/>
      <stop offset="60%" stop-color="#aed581"/>
      <stop offset="70%" stop-color="#ffb74d"/>
      <stop offset="80%" stop-color="#ff8a65"/>
      <stop offset="90%" stop-color="#e57373"/>
      <stop offset="100%" stop-color="#f06292"/>
      <animate attributeName="x1" from="0%" to="-300%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="300%" to="0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#rainbow)"/>
</svg>
