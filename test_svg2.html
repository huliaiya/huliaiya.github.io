<!DOCTYPE html>
<html>
<body>
<h2>SVG SMIL Animation Test</h2>

<h3>Test: Simple rect color animation</h3>
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="100">
    <animate attributeName="fill" values="#f06292;#ba68c8;#64b5f6;#4dd0e1;#81c784;#ffb74d;#f06292" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>

<h3>Test: Moving gradient (using rect transform)</h3>
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="16%" stop-color="#ba68c8"/>
      <stop offset="33%" stop-color="#64b5f6"/>
      <stop offset="50%" stop-color="#4dd0e1"/>
      <stop offset="66%" stop-color="#81c784"/>
      <stop offset="83%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="100" fill="url(#g1)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

<h3>Test: animateTransform on gradient stop</h3>
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="300%" y2="0%">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="10%" stop-color="#ba68c8"/>
      <stop offset="20%" stop-color="#64b5f6"/>
      <stop offset="30%" stop-color="#4dd0e1"/>
      <stop offset="40%" stop-color="#81c784"/>
      <stop offset="50%" stop-color="#aed581"/>
      <stop offset="60%" stop-color="#ffb74d"/>
      <stop offset="70%" stop-color="#ff8a65"/>
      <stop offset="80%" stop-color="#e57373"/>
      <stop offset="90%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#ba68c8"/>
      <animate attributeName="x1" values="0%;-300%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="300" height="100" fill="url(#g2)"/>
</svg>

</body>
</html>
