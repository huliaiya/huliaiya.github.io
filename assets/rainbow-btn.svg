<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120" preserveAspectRatio="none">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="50%" x2="300%" y2="50%">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="12%" stop-color="#fb5607"/>
      <stop offset="25%" stop-color="#ffbe0b"/>
      <stop offset="37%" stop-color="#8338ec"/>
      <stop offset="50%" stop-color="#3a86ff"/>
      <stop offset="62%" stop-color="#06ffa5"/>
      <stop offset="75%" stop-color="#ffbe0b"/>
      <stop offset="87%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#ff006e"/>
      <animate attributeName="x1" values="0%;-300%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300%;0%;300%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="500" height="120" fill="url(#rainbow)" filter="url(#glow)"/>
</svg>
