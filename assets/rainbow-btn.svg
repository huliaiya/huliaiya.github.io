<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" preserveAspectRatio="none">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="300%" y2="100%">
      <stop offset="0%" stop-color="#ff9ec7"/>
      <stop offset="18%" stop-color="#d4a5ff"/>
      <stop offset="36%" stop-color="#a5c4ff"/>
      <stop offset="54%" stop-color="#a8e6cf"/>
      <stop offset="72%" stop-color="#ffe8a3"/>
      <stop offset="90%" stop-color="#ffc9a3"/>
      <stop offset="100%" stop-color="#ff9ec7"/>
      <animate attributeName="x1" values="0%;-300%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300%;0%;300%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="innerShadow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.08)"/>
      <stop offset="30%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
  </defs>
  <rect width="600" height="140" fill="url(#rainbow)" rx="70" ry="70"/>
  <rect width="600" height="70" fill="url(#topGloss)" rx="70" ry="70"/>
  <rect width="600" height="140" fill="url(#innerShadow)" rx="70" ry="70"/>
</svg>
