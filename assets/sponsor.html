<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>赞助 Huli</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 60px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.25) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.2) 0%, transparent 60%);
    z-index: -1;
  }
  .title {
    text-align: center;
    margin-bottom: 48px;
  }
  .title h1 {
    font-size: 42px;
    color: #fff;
    margin-bottom: 12px;
    text-shadow: 0 2px 20px rgba(255,255,255,0.1);
  }
  .title p {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
  }
  .cards {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1200px;
  }
  .card {
    width: 300px;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.37),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 
      0 16px 48px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .card.alipay {
    background: linear-gradient(135deg, rgba(22, 119, 255, 0.25), rgba(22, 119, 255, 0.1));
    border-color: rgba(22, 119, 255, 0.4);
  }
  .card.wechat {
    background: linear-gradient(135deg, rgba(7, 193, 96, 0.25), rgba(7, 193, 96, 0.1));
    border-color: rgba(7, 193, 96, 0.4);
  }
  .card.afdian {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(168, 85, 247, 0.1));
    border-color: rgba(168, 85, 247, 0.4);
  }
  .card-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .alipay .card-icon { background: linear-gradient(135deg, #1677ff, #0958d9); }
  .wechat .card-icon { background: linear-gradient(135deg, #07c160, #06ad56); }
  .afdian .card-icon { background: linear-gradient(135deg, #a855f7, #9333ea); }
  .card h3 {
    font-size: 22px;
    color: #fff;
    margin-bottom: 4px;
  }
  .card .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 20px;
  }
  .qrcode {
    width: 180px;
    height: 180px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .qrcode img {
    width: 100%;
    height: 100%;
    border-radius: 8px;
  }
  .qrcode .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 14px;
    border: 2px dashed #ccc;
    border-radius: 8px;
  }
  .card .name {
    font-size: 15px;
    color: rgba(255,255,255,0.9);
    margin-bottom: 4px;
  }
  .card .tag {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: #fff;
    margin-top: 4px;
  }
  .alipay .tag { background: rgba(22, 119, 255, 0.6); }
  .wechat .tag { background: rgba(7, 193, 96, 0.6); }
  .afdian .tag { background: rgba(168, 85, 247, 0.6); }
  .footer-note {
    margin-top: 48px;
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="title">
    <h1>💖 赞助支持 Huli</h1>
    <p>你的每一份支持，都是这个项目持续前进的最大动力</p>
  </div>

  <div class="cards">
    <div class="card alipay">
      <div class="card-icon">支</div>
      <h3>支付宝</h3>
      <p class="subtitle">推荐使用 · 支持花呗/信用卡</p>
      <div class="qrcode">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=https://www.ifdian.net/a/hulihulihuli" alt="支付宝收款码" />
      </div>
      <p class="name">狐狸科技</p>
      <span class="tag">经营</span>
    </div>

    <div class="card wechat">
      <div class="card-icon">微</div>
      <h3>微信支付</h3>
      <p class="subtitle">微信扫码，方便快捷</p>
      <div class="qrcode">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=https://www.ifdian.net/a/hulihulihuli" alt="微信收款码" />
      </div>
      <p class="name">狐狸</p>
      <span class="tag">经营</span>
    </div>

    <div class="card afdian">
      <div class="card-icon">💖</div>
      <h3>爱发电</h3>
      <p class="subtitle">长期赞助 · 解锁更多权益</p>
      <div class="qrcode">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=https://www.ifdian.net/a/hulihulihuli" alt="爱发电主页" />
      </div>
      <p class="name">hulihulihuli</p>
      <span class="tag">创作中</span>
    </div>
  </div>

  <p class="footer-note">扫码后请备注你的昵称，感谢你的支持 ❤️</p>
</body>
</html>
